name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🔹 Backend Build
      - name: Install Backend
        run: |
          cd backend
          npm install
          npm run build

      # 🔹 Frontend Build
      - name: Install Frontend
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devsync-PR-

            echo "📥 Pull latest code"
            git pull origin main

            echo "📦 Backend setup"
            cd backend
            npm install
            npm run build

            echo "♻️ Restart backend"
            pm2 restart backend || pm2 start dist/server.js --name backend

            echo "🌐 Frontend setup"
            cd ../frontend
            npm install
            npm run build

            echo "✅ Deployment finished"