name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

  deploy:   # ✅ INSIDE jobs
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # 🔧 Build frontend in GitHub
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # 📦 Copy dist to EC2
      - name: Copy frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/frontend-build"

      # 🚀 SSH deploy
      - name: Deploy Backend + Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pull backend"
            cd ~/devsync-PR-/backend
            git pull
            npm install
            npm run build
            pm2 restart backend

            echo "🚀 Deploy frontend"
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/frontend-build/* /var/www/html/

            sudo systemctl restart nginx