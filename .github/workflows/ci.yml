name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

  # ❌ frontend job removed from deploy dependency (optional: keep or remove fully)

  deploy:
    runs-on: ubuntu-latest
    needs: [backend]   # ✅ ONLY backend

    steps:
      - name: Deploy Backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pull latest code"
            cd ~/devsync-PR-
            git pull

            echo "📦 Backend setup"
            cd backend
            npm install
            npm run build
            pm2 restart backend