name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

  deploy:   # ✅ FIXED (inside jobs)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Deploy Backend + Frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pull latest code"
            cd ~/devsync-PR-
            git pull

            echo "📦 Backend setup"
            cd backend
            npm install
            npm run build
            pm2 restart backend

            echo "📦 Frontend build"
            cd ../frontend
            npm run build

            echo "🚀 Deploy frontend"
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            sudo systemctl restart nginx